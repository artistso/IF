[workspace]
members = [
    "crates/inkframe-core",
    "crates/inkframe-engine",
    "crates/inkframe-raster",
    "crates/inkframe-android",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
inkframe-core = { path = "crates/inkframe-core" }
inkframe-engine = { path = "crates/inkframe-engine" }
inkframe-raster = { path = "crates/inkframe-raster" }
