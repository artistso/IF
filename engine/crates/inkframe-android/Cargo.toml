[package]
name = "inkframe-android"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "inkframe_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
inkframe-core.workspace = true
# The Android cdylib must be named `inkframe_engine` for System.loadLibrary.
# Alias the Rust engine dependency so rustdoc never receives two extern crates
# with that same name when this crate is built as both rlib and cdylib.
inkframe-engine-core = { package = "inkframe-engine", path = "../inkframe-engine" }
inkframe-raster.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
ash = "0.38.0"
jni = "0.22.4"
# ANativeWindow_fromSurface/ANativeWindow_release are provided by libandroid.
# Enabling ndk-sys's `nativewindow` feature adds -lnativewindow, which is only
# needed for newer Native Window APIs and breaks our baseline Android link.
ndk-sys = "0.6.0"
