[package]
name = "inkframe-android"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# Keep the JNI/shared-object crate distinct from the pure Rust `inkframe-engine`
# dependency. This avoids rustdoc/extern-name collisions and makes the binary's
# platform role explicit: Android loads libinkframe_android.so.
name = "inkframe_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
inkframe-core.workspace = true
inkframe-engine.workspace = true
inkframe-raster.workspace = true

[build-dependencies]
naga = { version = "30.0.0", features = ["wgsl-in", "spv-out"] }

[target.'cfg(target_os = "android")'.dependencies]
ash = "0.38.0"
jni = "0.22.4"
# ANativeWindow_fromSurface/ANativeWindow_release are provided by libandroid.
# Enabling ndk-sys's `nativewindow` feature adds -lnativewindow, which is only
# needed for newer Native Window APIs and breaks our baseline Android link.
ndk-sys = "0.6.0"
